[workspace]
members = [
  "crates/agentd-api",
  "crates/agentd-store",
  "crates/agentd-core",
  "crates/agentd-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["agentd contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "process", "io-util"] }
axum = { version = "0.7", features = ["macros"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
hex = "0.4"
url = { version = "2", features = ["serde"] }
libsql = { version = "=0.9.30", default-features = false, features = ["core"] }
croner = "3"
fastembed = { version = "=5.17.3", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }

# Keep debug builds small: line tables are enough for backtraces/panics, but
# drop the full DWARF symbols that bloat `target/debug` (per-dep + accumulated).
[profile.dev]
debug = "line-tables-only"
