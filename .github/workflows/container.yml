name: Publish agentd image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
      - uses: docker/metadata-action@v6
        id: sandbox-meta
        with:
          images: ghcr.io/${{ github.repository }}-sandbox
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        id: sandbox-image
        with:
          context: .
          file: ./Dockerfile.sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.sandbox-meta.outputs.tags }}
          labels: ${{ steps.sandbox-meta.outputs.labels }}
          cache-from: |
            type=gha,scope=sandbox
            type=registry,ref=ghcr.io/${{ github.repository }}-sandbox:buildcache
          cache-to: |
            type=gha,mode=max,scope=sandbox
            type=registry,ref=ghcr.io/${{ github.repository }}-sandbox:buildcache,mode=max
      - name: Record sandbox digest
        run: echo 'Sandbox image digest `${{ steps.sandbox-image.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
