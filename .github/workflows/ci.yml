name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      # microsandbox uses SQLx/SQLite while agentd uses libSQL's bundled SQLite.
      # Link SQLx to the system library so the final Linux binaries contain only
      # one statically bundled SQLite implementation.
      LIBSQLITE3_SYS_USE_PKG_CONFIG: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev libsqlite3-dev pkg-config
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Deployment checks
        run: bash scripts/test_deployment.sh
